<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人网站 · 新中式风格 · 简介与行迹">
  <title>洛晴跃飞</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260918a">
  <!-- ?v= 是版本号：改了 style.css 却没生效时，把数字加一即可绕过浏览器缓存 -->
  <link rel="stylesheet" href="css/style.css?v=20260918m">
</head>
<body>

  <!-- ══════════ 导航 ══════════ -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="#hero" data-nav>
        <span class="nav-seal" id="nav-seal">清</span>
        <span class="nav-name" id="nav-name">洛晴跃飞</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#hero" data-nav>卷首</a></li>
        <li><a href="#profile" data-nav>其人</a></li>
        <li><a href="#works" data-nav>行迹</a></li>
        <li><a href="#hobbies" data-nav>所好</a></li>
        <li><a href="#contact" data-nav>相邀</a></li>
      </ul>
    </div>
  </nav>

  <!-- ══════════ 卷首 ══════════ -->
  <header class="hero" id="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-clouds" aria-hidden="true">
      <svg class="cloud-layer" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#FBFDFE"/>
            <stop offset="55%"  stop-color="#EFF4F7"/>
            <stop offset="100%" stop-color="#CFDDE5"/>
          </linearGradient>
        </defs>
        <g class="ink-cloud cloud-a"><path d="M0,22 C8,20 18,22 28,20 C34,14 46,14 52,20 C60,16 74,16 82,21 C90,18 94,22 90,25 C76,28 60,28 44,26 C30,28 14,28 4,26 C-2,25 -2,23 0,22 Z"/></g>
        <g class="ink-cloud cloud-b"><path d="M0,40 C-14,40 -20,30 -12,25 C-18,15 -8,6 4,10 C8,-2 24,-5 32,3 C42,-5 58,-1 62,11 C72,9 80,20 74,28 C82,34 76,44 64,43 C56,46 40,46 30,43 C18,46 8,46 0,40 Z"/></g>
        <g class="ink-cloud cloud-c"><path d="M0,30 C10,26 22,30 34,27 C42,18 58,18 66,27 C76,22 92,24 100,30 C108,26 120,28 122,34 C106,40 86,40 66,38 C46,40 26,40 12,38 C2,37 -2,33 0,30 Z"/></g>
        <g class="ink-cloud cloud-d"><path d="M0,22 C8,20 18,22 28,20 C34,14 46,14 52,20 C60,16 74,16 82,21 C90,18 94,22 90,25 C76,28 60,28 44,26 C30,28 14,28 4,26 C-2,25 -2,23 0,22 Z"/></g>
        <g class="ink-cloud cloud-e"><path d="M0,40 C-14,40 -20,30 -12,25 C-18,15 -8,6 4,10 C8,-2 24,-5 32,3 C42,-5 58,-1 62,11 C72,9 80,20 74,28 C82,34 76,44 64,43 C56,46 40,46 30,43 C18,46 8,46 0,40 Z"/></g>
      </svg>
    </div>
    <div class="hero-mist"></div>
    <div class="hero-content">
      <div class="hero-vertical">
        <h1 class="hero-title" id="hero-title">洛晴跃飞</h1>
        <span class="hero-seal" id="hero-seal">明智</span>
      </div>
      <p class="hero-quote" id="hero-quote">行到水穷处，坐看云起时</p>
      <p class="hero-sub" id="hero-sub">一个人的行走、记录与热爱</p>
    </div>

    <a class="hero-scroll" href="#profile" aria-label="向下滚动">
      <span class="hero-scroll-text">下 滑</span>
      <span class="hero-scroll-arrow"></span>
    </a>
  </header>

  <main>

    <!-- ══════════ 壹 · 其人 ══════════ -->
    <section class="section" id="profile">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-num">壹</span>
          <div class="section-title-wrap">
            <h2 class="section-title">其人</h2>
            <span class="section-en">A B O U T &nbsp; M E</span>
          </div>
          <i class="section-rule"></i>
        </div>
        <div class="profile-grid" id="profile-content"><!-- JS 渲染 --></div>
      </div>
    </section>

    <!-- ══════════ 贰 · 行迹（作品集） ══════════ -->
    <section class="section section-alt" id="works">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-num">贰</span>
          <div class="section-title-wrap">
            <h2 class="section-title">行迹</h2>
            <span class="section-en">M Y &nbsp; W O R K S</span>
          </div>
          <i class="section-rule"></i>
        </div>

        <div class="tabs reveal" id="works-tabs">
          <button class="tab active" data-tab="photos">照片集</button>
          <button class="tab" data-tab="travel">旅行随笔</button>
          <button class="tab" data-tab="videos">影像集</button>
        </div>

        <!-- 照片集 -->
        <div class="tab-panel active" id="panel-photos">
          <div class="photo-grid" id="photo-grid"><!-- JS 渲染 --></div>
        </div>

        <!-- 旅行随笔 -->
        <div class="tab-panel" id="panel-travel">
          <div class="travel-list" id="travel-list"><!-- JS 渲染 --></div>
        </div>

        <!-- 影像集（社交视频平台入口） -->
        <div class="tab-panel" id="panel-videos">
          <div class="social-grid" id="social-grid"><!-- JS 渲染 --></div>
        </div>
      </div>
    </section>

    <!-- ══════════ 叁 · 所好 ══════════ -->
    <section class="section" id="hobbies">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-num">叁</span>
          <div class="section-title-wrap">
            <h2 class="section-title">所好</h2>
            <span class="section-en">M Y &nbsp; H O B B I E S</span>
          </div>
          <i class="section-rule"></i>
        </div>
        <div class="hobby-grid" id="hobby-grid" data-zoom-target><!-- JS 渲染 --></div>
      </div>
    </section>

    <!-- ══════════ 肆 · 相邀 ══════════ -->
    <section class="section section-alt" id="contact">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-num">肆</span>
          <div class="section-title-wrap">
            <h2 class="section-title">相邀</h2>
            <span class="section-en">C O N T A C T</span>
          </div>
          <i class="section-rule"></i>
        </div>
        <div class="contact-wrap reveal" id="contact-content"><!-- JS 渲染 --></div>
      </div>
    </section>

  </main>

  <!-- ══════════ 页脚 ══════════ -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-vertical" id="footer-motto">诗意趁年华</div>
      <p class="footer-text" id="footer-text">© 2026 洛晴跃飞，以影存真</p>
    </div>
  </footer>

  <!-- ══════════ 图集缩略图选择器（点击相册封面先弹出，选一张再进灯箱） ══════════ -->
  <div class="album-browser" id="album-browser" aria-hidden="true">
    <div class="album-browser-backdrop"></div>
    <div class="album-browser-sheet" role="dialog" aria-modal="true">
      <button class="album-browser-close" id="album-browser-close" aria-label="关闭">&times;</button>
      <header class="album-browser-head">
        <span class="album-browser-seal" id="album-browser-seal"></span>
        <h3 class="album-browser-title" id="album-browser-title"></h3>
        <span class="album-browser-count" id="album-browser-count"></span>
      </header>
      <div class="album-browser-body">
        <div class="album-browser-grid" id="album-browser-grid"><!-- JS 渲染 --></div>
        <!-- 右侧极细下滑进度条 -->
        <div class="album-browser-rail" id="album-browser-rail" aria-hidden="true">
          <span class="album-browser-rail-thumb" id="album-browser-rail-thumb"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════ 照片灯箱 ══════════ -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <button class="lightbox-close" id="lightbox-close" aria-label="关闭">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="上一张">&#8249;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="下一张">&#8250;</button>
    <figure class="lightbox-figure">
      <span class="lightbox-shot">
        <img id="lightbox-img" src="" alt="">
      </span>
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <!-- ══════════ 随笔正文 卷轴模态 ══════════ -->
  <div class="modal" id="article-modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <button class="modal-close" id="modal-close" aria-label="关闭">&times;</button>
    <article class="modal-paper" id="modal-body"><!-- JS 渲染 --></article>
  </div>

  <!-- ══════════ 点亮中国 · 城市地图弹窗 ══════════ -->
  <div class="modal city-map-modal" id="city-map-modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <button class="modal-close" id="city-map-close" aria-label="关闭">&times;</button>
    <article class="city-map-paper" id="city-map-body"><!-- JS 渲染 --></article>
  </div>

  <script src="js/data.js?v=20260918n"></script>
  <script src="js/china-map.js?v=20260918m"></script>
  <script src="js/main.js?v=20260918m"></script>
</body>
</html>
