<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EEDD"/>
      <stop offset="1" stop-color="#F2E4CB"/>
    </linearGradient>
    <radialGradient id="sun2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9754E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D9754E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky2)"/>

  <!-- 落日 -->
  <circle cx="900" cy="300" r="150" fill="url(#sun2)"/>
  <circle cx="900" cy="300" r="74" fill="#CE6B45" opacity="0.85"/>

  <!-- 秋山三重 -->
  <path d="M0,440 Q180,320 360,420 Q540,510 720,400 Q900,300 1080,410 Q1150,450 1200,430 L1200,570 L0,570 Z" fill="#D8B794" opacity="0.7"/>
  <path d="M0,490 Q220,380 440,470 Q660,555 880,450 Q1050,370 1200,480 L1200,610 L0,610 Z" fill="#B58A5F" opacity="0.8"/>
  <path d="M0,540 Q260,440 520,530 Q780,615 1040,510 Q1130,475 1200,520 L1200,680 L0,680 Z" fill="#7C543A" opacity="0.9"/>

  <!-- 山间霭气 -->
  <rect x="0" y="520" width="1200" height="20" fill="#F5EBD8" opacity="0.55"/>

  <!-- 归鸟一列 -->
  <g stroke="#6B4A32" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M250,200 q9,-9 18,0 M268,200 q9,-9 18,0"/>
    <path d="M330,168 q8,-8 16,0 M346,168 q8,-8 16,0"/>
    <path d="M410,205 q7,-7 14,0 M424,205 q7,-7 14,0"/>
    <path d="M470,150 q6,-6 12,0 M482,150 q6,-6 12,0"/>
  </g>

  <!-- 枫枝一角 -->
  <g transform="translate(0,0)">
    <path d="M-10,60 Q80,40 150,86 Q220,130 300,120" stroke="#7C543A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M150,86 Q190,60 230,64" stroke="#7C543A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="#B5432F" opacity="0.85">
      <circle cx="90" cy="52" r="7"/>
      <circle cx="122" cy="70" r="6"/>
      <circle cx="168" cy="58" r="7"/>
      <circle cx="205" cy="70" r="6"/>
      <circle cx="238" cy="66" r="7"/>
      <circle cx="262" cy="86" r="5"/>
      <circle cx="292" cy="102" r="6"/>
      <circle cx="312" cy="118" r="5"/>
    </g>
  </g>

  <!-- 落款 -->
  <text x="64" y="716" font-family="KaiTi, STKaiti, SimSun, serif" font-size="30" fill="#7C543A" letter-spacing="6" opacity="0.92">秋山落照</text>
  <g transform="translate(70,736)">
    <rect width="40" height="40" rx="4" fill="#A83A32"/>
    <text x="20" y="29" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#F7EFE2">行</text>
  </g>
</svg>
