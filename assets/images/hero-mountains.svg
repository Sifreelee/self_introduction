<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F6EF"/>
      <stop offset="0.6" stop-color="#F2EFE5"/>
      <stop offset="1" stop-color="#EBE7D9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hsky)"/>

  <!-- 天际淡山 -->
  <path d="M0,560 Q240,430 480,540 Q700,640 940,520 Q1180,400 1420,530 Q1650,640 1920,500 L1920,720 L0,720 Z" fill="#D6DEDA" opacity="0.55"/>

  <!-- 中景 -->
  <path d="M0,640 Q300,480 620,610 Q940,730 1260,590 Q1560,460 1920,610 L1920,820 L0,820 Z" fill="#AFC2BE" opacity="0.6"/>

  <!-- 近山黛青 -->
  <path d="M0,730 Q360,560 720,700 Q1080,830 1440,680 Q1700,580 1920,690 L1920,920 L0,920 Z" fill="#6E8A89" opacity="0.75"/>

  <!-- 最前峰 -->
  <path d="M0,840 Q400,700 820,830 Q1240,950 1920,790 L1920,1080 L0,1080 Z" fill="#3E5B5C" opacity="0.85"/>

  <!-- 云雾 -->
  <g fill="#F6F4EC" opacity="0.85">
    <ellipse cx="500" cy="640" rx="360" ry="34"/>
    <ellipse cx="1300" cy="580" rx="420" ry="40"/>
    <ellipse cx="960" cy="760" rx="520" ry="36" opacity="0.7"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#5A6E6C" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M640,360 q12,-12 24,0 M664,360 q12,-12 24,0"/>
    <path d="M740,320 q10,-10 20,0 M760,320 q10,-10 20,0"/>
    <path d="M1180,300 q11,-11 22,0 M1202,300 q11,-11 22,0"/>
  </g>

  <!-- 远帆一点 -->
  <g opacity="0.7">
    <path d="M1620,878 Q1650,892 1680,878 L1672,872 Q1650,882 1628,872 Z" fill="#2E4244"/>
    <path d="M1648,842 L1648,874" stroke="#2E4244" stroke-width="2.6"/>
    <path d="M1648,844 Q1666,854 1664,868 L1648,868 Z" fill="#F6F4EC" stroke="#2E4244" stroke-width="1.6"/>
  </g>

  <!-- 水纹 -->
  <g stroke="#8FA8A4" stroke-width="2.4" stroke-linecap="round" opacity="0.45">
    <path d="M300,960 h130"/>
    <path d="M820,1000 h170"/>
    <path d="M1300,950 h140"/>
  </g>
</svg>
