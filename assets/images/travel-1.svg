<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F6EE"/>
      <stop offset="1" stop-color="#EDF0EA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky1)"/>

  <!-- 远山三重 -->
  <path d="M0,430 Q160,300 340,400 Q520,490 700,380 Q880,280 1050,390 Q1130,440 1200,410 L1200,560 L0,560 Z" fill="#C9D6D1" opacity="0.65"/>
  <path d="M0,480 Q200,360 420,460 Q640,545 860,440 Q1040,360 1200,470 L1200,600 L0,600 Z" fill="#9DB3AF" opacity="0.75"/>
  <path d="M0,530 Q240,420 480,515 Q720,600 960,500 Q1100,445 1200,505 L1200,660 L0,660 Z" fill="#5F7D7C" opacity="0.85"/>

  <!-- 水面留白与水纹 -->
  <rect x="0" y="655" width="1200" height="145" fill="#F4F3EA"/>
  <g stroke="#8FA8A4" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M180,700 h90"/>
    <path d="M420,730 h120"/>
    <path d="M760,700 h100"/>
    <path d="M950,740 h80"/>
    <path d="M240,762 h70"/>
  </g>

  <!-- 孤舟与撑篙人 -->
  <g>
    <path d="M560,646 Q600,664 640,646 L626,640 Q600,652 574,640 Z" fill="#33352E"/>
    <circle cx="596" cy="626" r="6" fill="#33352E"/>
    <path d="M590,633 Q596,630 602,633 L600,646 L592,646 Z" fill="#33352E"/>
    <path d="M604,610 L610,650" stroke="#33352E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#5A6E6C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M300,220 q10,-10 20,0 M320,220 q10,-10 20,0"/>
    <path d="M380,190 q8,-8 16,0 M396,190 q8,-8 16,0"/>
    <path d="M340,250 q7,-7 14,0 M354,250 q7,-7 14,0"/>
  </g>

  <!-- 落款 -->
  <text x="64" y="690" font-family="KaiTi, STKaiti, SimSun, serif" font-size="30" fill="#5B6A66" letter-spacing="6" opacity="0.9">春江泛舟</text>
  <g transform="translate(70,710)">
    <rect width="40" height="40" rx="4" fill="#A83A32"/>
    <text x="20" y="29" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#F7EFE2">行</text>
  </g>
</svg>
