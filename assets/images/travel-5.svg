<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6ECd4"/>
      <stop offset="1" stop-color="#F0E0BE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky5)"/>

  <!-- 白日 -->
  <circle cx="330" cy="180" r="64" fill="#F8F2E0" opacity="0.95"/>
  <circle cx="330" cy="180" r="90" fill="#F8F2E0" opacity="0.35"/>

  <!-- 沙丘三重 -->
  <path d="M0,480 Q300,340 620,470 Q920,585 1200,430 L1200,640 L0,640 Z" fill="#E3CBA0" opacity="0.85"/>
  <path d="M0,560 Q360,430 700,560 Q1000,665 1200,520 L1200,720 L0,720 Z" fill="#C9A76E" opacity="0.9"/>
  <path d="M0,650 Q400,540 800,650 Q1030,710 1200,640 L1200,800 L0,800 Z" fill="#A8843F" opacity="0.85"/>

  <!-- 驼队剪影 -->
  <g fill="#57422A">
    <!-- 引领驼 -->
    <g transform="translate(430,560) scale(1.15)">
      <path d="M0,34 C-2,26 4,16 12,18 C16,10 30,10 34,18 C42,16 48,24 46,32 L46,44 L0,44 Z"/>
      <path d="M44,30 C48,22 50,14 52,10 L57,10 L57,13 C55,16 53,20 51,26 L46,32 Z"/>
      <rect x="56" y="8" width="10" height="4" rx="2"/>
      <rect x="6" y="44" width="4" height="18"/>
      <rect x="36" y="44" width="4" height="18"/>
      <rect x="16" y="44" width="4" height="16"/>
      <rect x="26" y="44" width="4" height="16"/>
    </g>
    <!-- 驼二 -->
    <g transform="translate(560,586)">
      <path d="M0,34 C-2,26 4,16 12,18 C16,10 30,10 34,18 C42,16 48,24 46,32 L46,44 L0,44 Z"/>
      <path d="M44,30 C48,22 50,14 52,10 L57,10 L57,13 C55,16 53,20 51,26 L46,32 Z"/>
      <rect x="56" y="8" width="10" height="4" rx="2"/>
      <rect x="6" y="44" width="4" height="18"/>
      <rect x="36" y="44" width="4" height="18"/>
      <rect x="16" y="44" width="4" height="16"/>
      <rect x="26" y="44" width="4" height="16"/>
    </g>
    <!-- 驼三（远景） -->
    <g transform="translate(676,600) scale(0.8)" opacity="0.75">
      <path d="M0,34 C-2,26 4,16 12,18 C16,10 30,10 34,18 C42,16 48,24 46,32 L46,44 L0,44 Z"/>
      <path d="M44,30 C48,22 50,14 52,10 L57,10 L57,13 C55,16 53,20 51,26 L46,32 Z"/>
      <rect x="56" y="8" width="10" height="4" rx="2"/>
      <rect x="6" y="44" width="4" height="18"/>
      <rect x="36" y="44" width="4" height="18"/>
      <rect x="16" y="44" width="4" height="16"/>
      <rect x="26" y="44" width="4" height="16"/>
    </g>
    <!-- 牵驼人 -->
    <g transform="translate(390,576)">
      <circle cx="8" cy="14" r="5.5"/>
      <path d="M2,21 Q8,18 14,21 L13,50 Q8,54 3,50 Z"/>
      <path d="M2,50 L1,62 L5,62 L6,51"/>
      <path d="M13,51 L13,62 L17,62 L15,50"/>
      <path d="M13,26 L30,24" stroke="#57422A" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 风纹 -->
  <g stroke="#B99B62" stroke-width="2.4" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M120,360 h130"/>
    <path d="M820,300 h160"/>
    <path d="M560,250 h100"/>
    <path d="M960,420 h140"/>
  </g>

  <!-- 落款 -->
  <text x="64" y="700" font-family="KaiTi, STKaiti, SimSun, serif" font-size="30" fill="#7A5A2E" letter-spacing="6" opacity="0.92">大漠驼铃</text>
  <g transform="translate(70,720)">
    <rect width="40" height="40" rx="4" fill="#A83A32"/>
    <text x="20" y="29" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#F7EFE2">行</text>
  </g>
</svg>
