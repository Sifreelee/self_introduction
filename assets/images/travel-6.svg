<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F4"/>
      <stop offset="1" stop-color="#E6ECEA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky6)"/>

  <!-- 雪山主峰 -->
  <path d="M100,560 L420,180 L560,360 L640,280 L860,560 Z" fill="#FBFCFB"/>
  <path d="M420,180 L560,360 L510,360 Z" fill="#D7E0DC" opacity="0.8"/>
  <path d="M640,280 L760,560 L700,560 Z" fill="#D7E0DC" opacity="0.6"/>
  <path d="M420,180 L480,270 L440,300 L470,340 L420,400 L360,300 L400,268 Z" fill="#F4F7F5"/>
  <!-- 山体淡墨 -->
  <path d="M100,560 L420,180 L560,360 L640,280 L860,560 Z" fill="none" stroke="#9BA8A4" stroke-width="3"/>
  <path d="M460,300 L520,560 M560,360 L590,560 M640,280 L680,560" stroke="#B7C2BE" stroke-width="2" opacity="0.7"/>

  <!-- 远峰 -->
  <path d="M680,520 L840,320 L980,520 Z" fill="#E4EBE8"/>
  <path d="M680,520 L840,320 L900,420 L840,440 Z" fill="#F6F9F7"/>
  <path d="M680,520 L840,320 L980,520 Z" fill="none" stroke="#A9B5B1" stroke-width="2"/>

  <!-- 雾带 -->
  <rect x="0" y="520" width="1200" height="26" fill="#F4F6F4" opacity="0.9"/>
  <rect x="0" y="548" width="1200" height="10" fill="#F4F6F4" opacity="0.6"/>

  <!-- 雪地 -->
  <path d="M0,560 Q300,540 600,562 Q900,584 1200,555 L1200,800 L0,800 Z" fill="#F5F7F5"/>
  <path d="M0,640 Q400,610 800,645 Q1000,660 1200,638 L1200,800 L0,800 Z" fill="#EDF1EE"/>

  <!-- 孤松 -->
  <g transform="translate(230,560)">
    <path d="M22,90 L22,10 C18,8 18,2 22,0 C26,2 26,8 22,10 L22,90 Z" fill="#2F4436" transform="scale(1.2) translate(-4,-8)"/>
    <path d="M4,86 Q10,60 6,36" stroke="#2F4436" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M8,58 Q-14,50 -22,58" stroke="#2F4436" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M7,40 Q30,30 42,38" stroke="#2F4436" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M6,66 Q-6,74 -16,80" stroke="#2F4436" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M8,30 Q24,18 30,12" stroke="#2F4436" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 松针团 -->
    <g fill="#2F4436">
      <ellipse cx="-24" cy="56" rx="16" ry="9"/>
      <ellipse cx="44" cy="36" rx="18" ry="10"/>
      <ellipse cx="30" cy="12" rx="14" ry="8"/>
      <ellipse cx="-14" cy="80" rx="13" ry="7"/>
      <ellipse cx="6" cy="-4" rx="12" ry="7"/>
    </g>
    <g fill="#3E5A47">
      <ellipse cx="-24" cy="53" rx="12" ry="6" opacity="0.7"/>
      <ellipse cx="44" cy="33" rx="13" ry="7" opacity="0.7"/>
    </g>
  </g>

  <!-- 飘雪 -->
  <g fill="#FFFFFF" stroke="#DCE4E0" stroke-width="0.6">
    <circle cx="180" cy="180" r="3"/>
    <circle cx="320" cy="260" r="2.4"/>
    <circle cx="520" cy="140" r="2.8"/>
    <circle cx="700" cy="230" r="2.2"/>
    <circle cx="950" cy="170" r="3"/>
    <circle cx="1080" cy="300" r="2.4"/>
    <circle cx="860" cy="120" r="2"/>
    <circle cx="420" cy="420" r="2.2"/>
    <circle cx="1010" cy="450" r="2.6"/>
    <circle cx="260" cy="360" r="2"/>
  </g>

  <!-- 寒鸦一只 -->
  <g stroke="#4A5A54" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M760,210 q9,-9 18,0 M778,210 q9,-9 18,0"/>
  </g>

  <!-- 落款 -->
  <text x="64" y="700" font-family="KaiTi, STKaiti, SimSun, serif" font-size="30" fill="#4E5E58" letter-spacing="6" opacity="0.92">雪岭孤松</text>
  <g transform="translate(70,720)">
    <rect width="40" height="40" rx="4" fill="#A83A32"/>
    <text x="20" y="29" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#F7EFE2">行</text>
  </g>
</svg>
