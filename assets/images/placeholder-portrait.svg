<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EE"/>
      <stop offset="1" stop-color="#EFE9DA"/>
    </linearGradient>
    <clipPath id="moonDoor">
      <circle cx="300" cy="370" r="172"/>
    </clipPath>
  </defs>

  <!-- 宣纸底 -->
  <rect width="600" height="800" fill="url(#pbg)"/>

  <!-- 装裱边框 -->
  <rect x="28" y="28" width="544" height="744" fill="none" stroke="#C6B995" stroke-width="2"/>
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#C6B995" stroke-width="0.8"/>

  <!-- 月洞门 -->
  <circle cx="300" cy="370" r="176" fill="#FDFBF6" stroke="#8C5B3F" stroke-width="4" opacity="0.9"/>
  <circle cx="300" cy="370" r="184" fill="none" stroke="#C6B995" stroke-width="1"/>

  <!-- 门内景致 -->
  <g clip-path="url(#moonDoor)">
    <rect x="110" y="180" width="380" height="380" fill="#FBF9F2"/>
    <!-- 远山三重 -->
    <path d="M110,340 Q170,270 240,325 Q300,368 360,320 Q430,265 490,330 L490,400 L110,400 Z" fill="#C9D6D3" opacity="0.7"/>
    <path d="M110,368 Q190,300 270,355 Q340,398 420,348 Q460,322 490,352 L490,420 L110,420 Z" fill="#9DB4B1" opacity="0.75"/>
    <path d="M110,392 Q200,340 300,388 Q400,432 490,380 L490,460 L110,460 Z" fill="#6E8A89" opacity="0.8"/>
    <!-- 云雾留白 -->
    <rect x="110" y="404" width="380" height="16" fill="#FBF9F2" opacity="0.85"/>
    <!-- 地面 -->
    <rect x="110" y="452" width="380" height="108" fill="#E8E3D2"/>
    <path d="M110,452 Q300,448 490,452 L490,560 L110,560 Z" fill="#E3DDCA"/>
    <!-- 立影 -->
    <g fill="#38362F">
      <circle cx="300" cy="424" r="9"/>
      <path d="M290,436 Q300,430 310,436 L308,486 Q300,492 292,486 Z"/>
      <path d="M292,486 L288,530 L294,530 L297,492 Z"/>
      <path d="M303,492 L306,530 L312,530 L308,486 Z"/>
    </g>
    <!-- 苔点 -->
    <circle cx="220" cy="500" r="3" fill="#8A9B84"/>
    <circle cx="238" cy="508" r="2" fill="#8A9B84"/>
    <circle cx="382" cy="496" r="3" fill="#8A9B84"/>
    <circle cx="368" cy="506" r="2" fill="#8A9B84"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#5A6E6C" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M150,215 q7,-7 14,0 M164,215 q7,-7 14,0"/>
    <path d="M196,198 q6,-6 12,0 M208,198 q6,-6 12,0"/>
  </g>

  <!-- 印章 -->
  <g transform="translate(486,84) rotate(3)">
    <rect width="52" height="52" rx="5" fill="#A83A32"/>
    <rect x="4" y="4" width="44" height="44" rx="3" fill="none" stroke="#E8D5C0" stroke-width="1.2"/>
    <text x="26" y="35" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="28" fill="#F7EFE2">像</text>
  </g>

  <!-- 提示文字 -->
  <text x="300" y="646" text-anchor="middle" font-family="KaiTi, STKaiti, SimSun, serif" font-size="30" fill="#635C4B" letter-spacing="10">此处放置您的照片</text>
  <text x="300" y="688" text-anchor="middle" font-family="KaiTi, STKaiti, SimSun, serif" font-size="17" fill="#9C947E" letter-spacing="5">替换 assets/images 中的 portrait 即可</text>
</svg>
