<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EEF0"/>
      <stop offset="1" stop-color="#DDE7E8"/>
    </linearGradient>
    <radialGradient id="moon3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBF7E8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FBF7E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky3)"/>

  <!-- 疏星 -->
  <g fill="#8FA4AC">
    <circle cx="180" cy="120" r="2.5"/>
    <circle cx="420" cy="80" r="2"/>
    <circle cx="640" cy="150" r="2.5"/>
    <circle cx="1080" cy="110" r="2"/>
    <circle cx="980" cy="180" r="1.8"/>
    <circle cx="300" cy="210" r="1.8"/>
  </g>

  <!-- 悬月 -->
  <circle cx="880" cy="240" r="180" fill="url(#moon3)"/>
  <circle cx="880" cy="240" r="80" fill="#FAF6E7"/>

  <!-- 夜山三重 -->
  <path d="M0,460 Q170,330 350,430 Q530,520 710,410 Q890,315 1060,420 Q1140,465 1200,440 L1200,580 L0,580 Z" fill="#7A93A0" opacity="0.55"/>
  <path d="M0,510 Q210,390 430,480 Q650,565 870,460 Q1050,385 1200,495 L1200,620 L0,620 Z" fill="#54707F" opacity="0.7"/>
  <path d="M0,560 Q250,455 500,545 Q750,630 1000,525 Q1110,480 1200,540 L1200,700 L0,700 Z" fill="#2E4552" opacity="0.9"/>

  <!-- 寒江 -->
  <rect x="0" y="695" width="1200" height="105" fill="#D3DFE0"/>
  <g stroke="#7A93A0" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M200,730 h80"/>
    <path d="M520,750 h110"/>
    <path d="M860,725 h90"/>
    <path d="M340,772 h70"/>
  </g>
  <!-- 月影 -->
  <ellipse cx="880" cy="740" rx="46" ry="7" fill="#F4EFDC" opacity="0.7"/>

  <!-- 独钓寒江 -->
  <g fill="#1E2E38">
    <path d="M470,690 Q505,705 540,690 L528,684 Q505,694 482,684 Z"/>
    <circle cx="502" cy="672" r="5.5"/>
    <path d="M497,679 Q502,675 507,679 L505,690 L499,690 Z"/>
    <path d="M508,660 L512,692" stroke="#1E2E38" stroke-width="2" stroke-linecap="round"/>
    <path d="M512,662 Q538,668 548,686" stroke="#1E2E38" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 落款 -->
  <text x="64" y="700" font-family="KaiTi, STKaiti, SimSun, serif" font-size="30" fill="#3A5260" letter-spacing="6" opacity="0.92">寒江月夜</text>
  <g transform="translate(70,720)">
    <rect width="40" height="40" rx="4" fill="#A83A32"/>
    <text x="20" y="29" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#F7EFE2">行</text>
  </g>
</svg>
