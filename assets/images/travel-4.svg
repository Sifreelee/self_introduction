<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F2E9"/>
      <stop offset="1" stop-color="#ECEAE0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky4)"/>

  <!-- 远塔 -->
  <g opacity="0.45" fill="#8FA0A8">
    <path d="M960,470 L960,300 L968,300 L968,470 Z"/>
    <path d="M946,310 Q964,282 982,310 L978,322 L950,322 Z"/>
    <rect x="942" y="470" width="44" height="12" rx="2"/>
  </g>

  <!-- 水岸线 -->
  <rect x="0" y="560" width="1200" height="240" fill="#E9E7DB"/>

  <!-- 民居群（白墙黛瓦） -->
  <g>
    <!-- 后排 -->
    <g transform="translate(90,400)">
      <rect x="0" y="40" width="150" height="130" fill="#FAF9F3" stroke="#C9C4B2" stroke-width="1"/>
      <path d="M-12,42 Q75,4 162,42 L146,42 L146,40 L12,40 L12,42 Z" fill="#39424A"/>
      <path d="M-12,42 Q75,4 162,42 L154,52 Q75,16 -4,52 Z" fill="#2C343B"/>
      <rect x="56" y="86" width="34" height="46" fill="#3A4550" opacity="0.25"/>
    </g>
    <g transform="translate(270,430)">
      <rect x="0" y="40" width="120" height="100" fill="#F7F6EF" stroke="#C9C4B2" stroke-width="1"/>
      <path d="M-10,42 Q60,8 130,42 L116,42 L116,40 L4,40 L4,42 Z" fill="#39424A"/>
      <path d="M-10,42 Q60,8 130,42 L124,50 Q60,18 -4,50 Z" fill="#2C343B"/>
    </g>
    <!-- 前排 -->
    <g transform="translate(520,440)">
      <rect x="0" y="30" width="180" height="120" fill="#FBFAF5" stroke="#C9C4B2" stroke-width="1"/>
      <path d="M-14,32 Q90,-8 194,32 L178,32 L178,30 L2,30 L2,32 Z" fill="#39424A"/>
      <path d="M-14,32 Q90,-8 194,32 L186,42 Q90,2 -6,42 Z" fill="#2C343B"/>
      <rect x="20" y="70" width="30" height="44" fill="#3A4550" opacity="0.22"/>
      <rect x="74" y="62" width="36" height="52" fill="#8A5A3C" opacity="0.3"/>
      <rect x="128" y="70" width="26" height="44" fill="#3A4550" opacity="0.22"/>
    </g>
    <g transform="translate(760,420)">
      <rect x="0" y="50" width="140" height="110" fill="#F8F7F0" stroke="#C9C4B2" stroke-width="1"/>
      <path d="M-12,52 Q70,16 152,52 L138,52 L138,50 L2,50 L2,52 Z" fill="#39424A"/>
      <path d="M-12,52 Q70,16 152,52 L146,60 Q70,24 -6,60 Z" fill="#2C343B"/>
      <path d="M-14,52 Q70,16 152,52 Q70,30 -14,52 Z" fill="#2C343B" opacity="0.5"/>
    </g>
    <!-- 马头墙 -->
    <g transform="translate(430,405)">
      <path d="M0,150 L0,60 L18,60 L18,44 L34,44 L34,28 L50,28 L50,18 L66,18 L66,150 Z" fill="#F5F3EA" stroke="#B9B4A2" stroke-width="1"/>
      <path d="M0,60 L18,60 L18,44 L34,44 L34,28 L50,28 L50,18 L66,18" fill="none" stroke="#39424A" stroke-width="4"/>
    </g>
  </g>

  <!-- 石拱桥 -->
  <g transform="translate(300,548)">
    <path d="M0,52 Q80,-24 160,52 L160,66 L0,66 Z" fill="#D8D4C4"/>
    <path d="M0,52 Q80,-24 160,52" fill="none" stroke="#A9A692" stroke-width="3"/>
    <path d="M0,52 Q80,-24 160,52 L160,44 Q80,-32 0,44 Z" fill="#C4BFAE"/>
    <path d="M18,52 Q80,-8 142,52" fill="none" stroke="#8F8C7A" stroke-width="4"/>
    <g stroke="#8F8C7A" stroke-width="3">
      <line x1="30" y1="36" x2="30" y2="52"/>
      <line x1="80" y1="22" x2="80" y2="40"/>
      <line x1="130" y1="36" x2="130" y2="52"/>
    </g>
  </g>

  <!-- 水面倒影 -->
  <g opacity="0.35">
    <rect x="600" y="560" width="180" height="8" fill="#39424A" opacity="0.5"/>
    <rect x="620" y="576" width="140" height="5" fill="#39424A" opacity="0.4"/>
    <path d="M300,620 Q380,648 460,620" fill="none" stroke="#8F8C7A" stroke-width="4" opacity="0.7"/>
    <path d="M320,636 Q380,654 440,636" fill="none" stroke="#8F8C7A" stroke-width="3" opacity="0.5"/>
  </g>
  <g stroke="#A9A692" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M120,640 h90"/>
    <path d="M720,690 h120"/>
    <path d="M940,650 h80"/>
    <path d="M180,730 h70"/>
    <path d="M860,752 h100"/>
  </g>

  <!-- 乌篷船 -->
  <g transform="translate(660,600)">
    <path d="M0,18 Q40,34 80,18 L70,12 Q40,24 10,12 Z" fill="#2C343B"/>
    <path d="M18,10 Q40,-8 62,10 Q40,2 18,10 Z" fill="#39424A"/>
    <path d="M36,-6 Q46,-14 50,-6 L50,10 L36,10 Z" fill="#2C343B" opacity="0.85"/>
  </g>

  <!-- 燕子 -->
  <g stroke="#333B42" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M820,160 q8,-8 16,0 M836,160 q8,-8 16,0"/>
    <path d="M890,130 q7,-7 14,0 M904,130 q7,-7 14,0"/>
  </g>

  <!-- 落款 -->
  <text x="64" y="716" font-family="KaiTi, STKaiti, SimSun, serif" font-size="30" fill="#4A5560" letter-spacing="6" opacity="0.92">水巷烟波</text>
  <g transform="translate(70,736)">
    <rect width="40" height="40" rx="4" fill="#A83A32"/>
    <text x="20" y="29" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#F7EFE2">行</text>
  </g>
</svg>
